name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # The VS Code extension ships with the compiler: built from onyxring/beguilex at this same tag,
  # so tag beguilex first. Every compiler bundle gets it in a beguilex/ folder with its docs.
  extension:
    name: Build Beguilex
    runs-on: ubuntu-latest
    steps:
      - name: Check that beguilex has this tag
        run: |
          if ! git ls-remote --exit-code --tags https://github.com/onyxring/beguilex.git "refs/tags/${{ github.ref_name }}" >/dev/null; then
            echo "::error::onyxring/beguilex has no tag ${{ github.ref_name }}. Push the beguilex tag, then re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          repository: onyxring/beguilex
          ref: ${{ github.ref_name }}
          path: beguilex

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package the extension
        working-directory: beguilex
        run: |
          npm ci
          npm run compile
          npx --yes @vscode/vsce package

      - name: Stage the beguilex folder
        run: |
          mkdir -p dist/beguilex
          cp beguilex/*.vsix dist/beguilex/
          for f in README.md CHANGELOG.md LICENSE; do cp "beguilex/$f" dist/beguilex/; done
          if [ -d beguilex/docs ]; then cp -R beguilex/docs dist/beguilex/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: beguilex
          path: dist/beguilex
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: extension
    runs-on: ${{ matrix.os }}
    # One build command on every platform. The only per-target flag left is macOS
    # -arch, which selects a slice rather than working around a portability gap:
    # isnumber, strncasecmp and popen/pclose are handled in platform.h, and the
    # <format> dependency is gone, so no -D renames, no -include, no libc++ install.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
            cxx: c++
            cflags: '-arch arm64'
            archive: tar.gz
          - os: macos-15
            target: macos-x86_64
            cxx: c++
            cflags: '-arch x86_64'
            archive: tar.gz
          - os: ubuntu-24.04
            target: linux-x64
            cxx: c++
            cflags: ''
            archive: tar.gz
          - os: windows-2022
            target: windows-x64
            cxx: clang++
            cflags: ''
            archive: zip

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the version is read from the tags

      - name: Read the version from the tags
        shell: bash
        run: sh gitDescribe.sh build/gitDescribe.h

      - uses: actions/download-artifact@v4
        with:
          name: beguilex
          path: beguilex-dist

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          ${{ matrix.cxx }} -std=c++17 -O2 -Wno-deprecated-declarations ${{ matrix.cflags }} *.cpp -o beguiler

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ${{ matrix.cxx }} -std=c++17 -O2 -Wno-deprecated-declarations ${{ matrix.cflags }} (Get-ChildItem -Filter *.cpp).Name -o beguiler.exe

      - name: Bundle release archive
        shell: bash
        run: |
          BUNDLE="beguile-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$BUNDLE"
          if [ -f beguiler.exe ]; then cp beguiler.exe "$BUNDLE/"; else cp beguiler "$BUNDLE/"; fi
          tar cf - beguiLib | tar xf - -C "$BUNDLE"
          tar cf - docs     | tar xf - -C "$BUNDLE"
          tar cf - examples | tar xf - -C "$BUNDLE"
          mkdir "$BUNDLE/beguilex"
          cp -R beguilex-dist/. "$BUNDLE/beguilex/"
          cp LICENSE README.md CHANGELOG.md "$BUNDLE/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "${BUNDLE}.zip" "$BUNDLE" >/dev/null
          else
            tar czf "${BUNDLE}.tar.gz" "$BUNDLE"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            beguile-*.tar.gz
            beguile-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/beguile-*.tar.gz
            artifacts/*/beguile-*.zip
            artifacts/beguilex/*.vsix
          draft: true
          prerelease: true
          generate_release_notes: true

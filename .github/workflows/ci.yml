name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # One build command on every platform. The only per-target flag left is macOS
    # -arch, which selects a slice rather than working around a portability gap:
    # isnumber, strncasecmp and popen/pclose are handled in platform.h, and the
    # <format> dependency is gone, so no -D renames, no -include, no libc++ install.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
            cxx: c++
            cflags: '-arch arm64'
          - os: macos-15
            target: macos-x86_64
            cxx: c++
            cflags: '-arch x86_64'
          - os: ubuntu-24.04
            target: linux-x64
            cxx: c++
            cflags: ''
          - os: windows-2022
            target: windows-x64
            cxx: clang++
            cflags: ''

    steps:
      - uses: actions/checkout@v5

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          ${{ matrix.cxx }} -std=c++17 -O2 -Wno-deprecated-declarations ${{ matrix.cflags }} *.cpp -o beguiler

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ${{ matrix.cxx }} -std=c++17 -O2 -Wno-deprecated-declarations ${{ matrix.cflags }} (Get-ChildItem -Filter *.cpp).Name -o beguiler.exe

      # Smoke test: the library-free hello world must transpile on every
      # platform. It needs no Inform 6 and no IF library, so a green build
      # here means the shipped binary runs and the transpiler works.
      - name: Smoke test (transpile hello world)
        shell: bash
        run: |
          BIN=./beguiler
          [ -f ./beguiler.exe ] && BIN=./beguiler.exe
          # beguiler writes artifacts into an output/ dir beside the source (default outputPath).
          OUT=examples/output/hello.bgl.transpiled.inf
          rm -f "$OUT"
          "$BIN" examples/hello.bgl
          if [ ! -f "$OUT" ]; then
            echo "::error::beguiler produced no .transpiled.inf for examples/hello.bgl (expected $OUT)"
            exit 1
          fi
          echo "✓ ${{ matrix.target }}: examples/hello.bgl transpiled"
